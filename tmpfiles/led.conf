# Copiare in /etc/tmpfiles.d/led.conf
#
# /run e' tmpfs, ricreato ad ogni boot — e led-daemon.sh cancella e ricrea
# /run/led/state.d ad ogni proprio avvio/riavvio (rm -rf nel cleanup di
# shutdown). Serve quindi una regola dichiarativa riapplicata ad ogni start
# del servizio (vedi ExecStartPre in led-daemon.service), non una singola
# chmod manuale che sparirebbe al riavvio successivo del demone.
#
# 2775 + gruppo "led": root (il demone) scrive sempre; chiunque sia nel
# gruppo "led" (es. l'utente che lancia VLC) puo' scrivere stati col comando
# led-ctl senza essere root. Crea il gruppo e aggiungici gli utenti che
# devono poter chiamare led-ctl da non-root:
#   sudo groupadd -f led
#   sudo usermod -aG led <utente>
d /run/led           2775 root led -
d /run/led/state.d   2775 root led -
